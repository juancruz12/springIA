spring.application.name=springia

spring.datasource.url=jdbc:mysql://localhost:3306/instituto?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Configuración de Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# CONFIGURACIÓN DE MODELOS AI
# ============================================
spring.ai.google.genai.api-key=
spring.ai.google.genai.chat.options.model=gemini-flash-latest
spring.ai.google.embedding.model=text-embedding-001

vectoresIA.api=http://localhost:8085/vector
